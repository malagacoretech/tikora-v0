<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tikora — Recibido</title>
<style>
  :root{--bg:#0A1628;--card:#101E33;--line:#1E3A5F;--text:#EAF1FA;--sub:#8FA3BD;--accent:#F5B301}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;text-align:center}
  .caja{max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2rem 1.4rem}
  .tick{font-size:2.6rem}
  h1{font-size:1.4rem;margin:0.6rem 0 0.4rem}
  p{color:var(--sub);line-height:1.55}
</style>
</head>
<body>
<div class="caja">
  <div class="tick">✅</div>
  <h1>Recibido.</h1>
  <p>Ya tengo tus datos. Te escribo por WhatsApp para darte de alta — normalmente el mismo día.</p>
  <p style="margin-top:0.8rem">— Matías, Tikora</p>
</div>
</body>
</html>
